services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brightloop_db
    ports:
      - "5432:5432"
    volumes:
      - brightloop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brightloop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  brightloop_postgres_data:
    driver: local
