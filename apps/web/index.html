    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Brightloop — Enterprise Subscription Management & Recurring Billing Platform" />
    <title>Brightloop — Enterprise Subscription Management & Billing</title>

    <!-- Inter font for Linear typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Anti-FOUC Theme Initialization Script -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('brightloop-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (stored === 'system') {
            if (prefersDark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          } else {
            // Default to dark mode
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background font-sans antialiased text-foreground selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
